<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent IA Restaurant</title>

    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="flex min-h-screen items-center justify-center bg-gradient-to-br from-blue-50 to-gray-100 p-4">
    <div class="flex h-[calc(100vh-2rem)] w-full max-w-5xl flex-col overflow-hidden rounded-2xl bg-white shadow-2xl">
      <!-- Header -->
      <div class="bg-blue-600 p-5 text-white">
        <h1 class="text-2xl font-bold">🤖 Agent IA Restaurant</h1>

        <p class="mt-1 text-sm text-blue-100">Météo + restaurants adaptés à vos envies</p>
      </div>

      <!-- Messages -->
      <div id="messages" class="flex-1 space-y-4 overflow-y-auto bg-gray-50 p-6"></div>

      <!-- Footer -->
      <div class="border-t bg-white p-4">
        <p class="mb-3 text-sm text-gray-500">Exemple : "Trouve-moi un restaurant à Paris"</p>

        <div class="flex gap-3">
          <input
            id="inputMessage"
            type="text"
            placeholder="Votre demande..."
            class="flex-1 rounded-xl border px-4 py-3 focus:ring-2 focus:ring-blue-500 focus:outline-none"
          />

          <button
            id="sendButton"
            class="rounded-xl bg-blue-600 px-6 font-semibold text-white transition hover:bg-blue-700"
          >
            Envoyer
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="script.js"></script>
  </body>
</html>
